server.port=9090
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

spring.cloud.gateway.routes[0].id=recharge-service
spring.cloud.gateway.routes[0].uri=lb://recharge-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/recharges/**
spring.cloud.gateway.routes[1].id=processing-service
spring.cloud.gateway.routes[1].uri=lb://processing-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/processings/**

management.endpoints.web.exposure.include=*
